services:
  dt-twin-web:
    image: nginx:alpine
    container_name: dt-twin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8150:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.conf:/etc/nginx/snippets/headers.conf:ro
