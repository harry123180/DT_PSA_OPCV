server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # 在 cloudflared 後面，nginx 不知道外面是 https：轉址用相對路徑
    include /etc/nginx/snippets/headers.conf;

    # Unity 建置（decompressionFallback 的 .unityweb，內容是 Brotli）：標上 Content-Encoding 讓瀏覽器原生解壓
    location ~ \.wasm\.unityweb$ { include /etc/nginx/snippets/headers.conf; add_header Content-Encoding br; default_type application/wasm; add_header Cache-Control "public, max-age=3600"; }
    location ~ \.js\.unityweb$   { include /etc/nginx/snippets/headers.conf; add_header Content-Encoding br; default_type application/javascript; add_header Cache-Control "public, max-age=3600"; }
    location ~ \.unityweb$       { include /etc/nginx/snippets/headers.conf; add_header Content-Encoding br; default_type application/octet-stream; add_header Cache-Control "public, max-age=3600"; }

    location ~ \.mjs$  { include /etc/nginx/snippets/headers.conf; default_type application/javascript; add_header Cache-Control "no-cache"; }
    location ~ \.wasm$ { include /etc/nginx/snippets/headers.conf; default_type application/wasm; add_header Cache-Control "public, max-age=86400"; }
    location ~ \.py$   { include /etc/nginx/snippets/headers.conf; default_type text/plain; charset utf-8; add_header Cache-Control "no-cache"; }
    location ~ \.md$   { include /etc/nginx/snippets/headers.conf; default_type text/plain; charset utf-8; }
    location = /index.html { include /etc/nginx/snippets/headers.conf; add_header Cache-Control "no-cache"; }
    location ~ \.html$ { include /etc/nginx/snippets/headers.conf; add_header Cache-Control "no-cache"; }
    location ~ ^/([a-z]+/)?(app|bridge|registers|site)\.js$ { include /etc/nginx/snippets/headers.conf; add_header Cache-Control "no-cache"; }
    # 舊網址：產線以前在根目錄，現在在 /line/（根目錄是機台列表頁）
    location = /registers.html { return 301 /line/registers.html$is_args$args; }
    location ^~ /python/ { rewrite ^/python/(.*)$ /line/python/$1 permanent; }
    location ~ ^/[a-z]+/python/ { include /etc/nginx/snippets/headers.conf; autoindex on; }
}
